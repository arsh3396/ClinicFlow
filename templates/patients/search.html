<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicFlow | Secure Patient Search</title>
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Components Engine Workspace</span>
        </div>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <h3 class="card-title text-secondary mb-3">Consent-Aware EHR History Search</h3>
                        <form method="GET" action="" class="d-flex gap-2">
                            <input type="text" name="q" class="form-control form-control-lg" 
                                   placeholder="Type to query records (e.g. Fever, Fracture)..." value="{{ query }}" required>
                            <button type="submit" class="btn btn-primary btn-lg px-4">Search</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
